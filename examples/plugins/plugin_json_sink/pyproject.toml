[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-json-sink"
version = "0.1.0"
description = "Reference pyate plugin: JSON datalog sink"
requires-python = ">=3.10"
dependencies = ["pyate>=0.1"]

[project.entry-points."pyate.plugins"]
plugin_json_sink = "plugin_json_sink:Plugin"

[tool.setuptools]
packages = ["plugin_json_sink"]
